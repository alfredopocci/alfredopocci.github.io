<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- FORZA BARRE BROWSER NERE E SCURE SU IPHONE E ANDROID -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <title>Alfredo Pocci - MAN</title>
    <!-- Font moderno e pulito -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: #000000;
            width: 100%;
            height: 100%;
        }

        body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(circle at center, #3a4b5d 0%, #1e2732 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ----------------------------------------------------
            1. SCHERMATA INTRO LOGO (3 SECONDI)
        ---------------------------------------------------- */
        #loader {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-logo-img {
            max-width: 50vw;
            max-height: 35vh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.92);
            filter: blur(12px);
            animation: continuousZoomFade 2.8s linear forwards;
        }

        @keyframes continuousZoomFade {
            0% { opacity: 0; transform: scale(0.92); filter: blur(12px); }
            30% { opacity: 1; filter: blur(0px); }
            70% { opacity: 1; filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.05); filter: blur(10px); }
        }

        /* ----------------------------------------------------
            2. BIGLIETTO DA VISITA DIGITALE
        ---------------------------------------------------- */
        .card {
            width: 90%;
            max-width: 380px;
            height: 85vh;
            max-height: 720px;
            padding: 45px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Distribuisce lo spazio equamente */
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            opacity: 0;
            animation: fadeInCard 1.2s ease forwards 2.8s;
        }

        @keyframes fadeInCard {
            to { opacity: 1; }
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* NOME E COGNOME */
        .name-title {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(12px);
        }

        /* RUOLO PROFESSIONALE */
        .job-title {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 12px;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(12px);
        }

        /* LINEA ROSSA MAN */
        .red-line {
            width: 140px;
            height: 4px;
            background-color: #e60000;
            margin: 28px auto 36px auto;
            border-radius: 2px;
            opacity: 0;
            transform: scaleX(0);
            transform-origin: center;
            box-shadow: 0 0 12px rgba(230, 0, 0, 0.5);
        }

        /* CONTATTI (PULSANTI/SCHEDE) */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 16px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-action:active {
            background: rgba(230, 0, 0, 0.2);
            border-color: #e60000;
            transform: scale(0.98);
        }

        /* ICONE VETTORIALI BIANCHE */
        .svg-icon {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        /* AZIENDA & PARTITA IVA */
        .company-info {
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            opacity: 0;
            transform: translateY(25px);
            filter: blur(10px);
            user-select: none;
            width: 100%;
            margin-top: 20px;
        }

        .company-name {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 4px
